<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميزان — إدارة الأموال</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f1420; --card:#171e2e; --card2:#1e2739; --line:#2a3448;
    --txt:#e8edf7; --muted:#8b97ad;
    --green:#22c55e; --red:#ef4444; --accent:#6366f1; --gold:#f59e0b;
  }
  body{
    font-family:'Segoe UI',Tahoma,system-ui,sans-serif;
    background:radial-gradient(1100px 500px at 85% -10%, #1c2540 0%, #0f1420 55%) no-repeat, var(--bg);
    color:var(--txt); min-height:100vh; padding:20px 14px 70px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto}

  /* ==== الهيدر ==== */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;
        background:linear-gradient(135deg,#6366f1,#22c55e);box-shadow:0 6px 18px -6px #6366f1}
  h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
  .sub{font-size:12px;color:var(--muted)}
  input[type=month]{
    background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:10px 14px;border-radius:11px;font-size:14px;font-family:inherit;cursor:pointer;
  }
  input[type=month]:focus{outline:2px solid var(--accent);outline-offset:1px}

  /* ==== كروت الإحصاء ==== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;position:relative;overflow:hidden}
  .stat::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:7px}
  .stat .value{font-size:20px;font-weight:700;letter-spacing:-.5px;direction:ltr;text-align:right;unicode-bidi:plaintext}
  .stat .value small{font-size:12px;font-weight:500;color:var(--muted)}

  /* ==== الشبكة ==== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}
  .card h2{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:7px}

  /* ==== الفورم ==== */
  .tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:11px;margin-bottom:15px}
  .tab{flex:1;padding:9px;border:0;border-radius:8px;background:transparent;color:var(--muted);
       font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.18s}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px -4px var(--accent)}
  .tab.active[data-type=income]{background:var(--green);box-shadow:0 4px 12px -4px var(--green)}

  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field select{
    width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .field input[type=number]{direction:ltr;text-align:right}
  .btn-primary{
    width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent);color:#fff;
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.18s;margin-top:4px;
  }
  .btn-primary:hover{filter:brightness(1.12)}
  .btn-primary:active{transform:scale(.985)}

  /* ==== الشارت ==== */
  .chart-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
  canvas{width:190px;height:190px;display:block}
  .legend{width:100%;display:flex;flex-direction:column;gap:7px;max-height:180px;overflow-y:auto}
  .legend::-webkit-scrollbar{width:5px}
  .legend::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .lg .nm{flex:1;color:var(--muted)}
  .lg .vl{font-weight:600;direction:ltr}

  /* ==== الميزانيات ==== */
  .brow{margin-bottom:15px}
  .brow:last-child{margin-bottom:0}
  .btop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
  .bname{font-weight:600}
  .bnum{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .binput{
    width:78px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:4px 7px;border-radius:7px;font-family:inherit;font-size:12px;
    direction:ltr;text-align:center;
  }
  .binput:focus{outline:1.5px solid var(--accent);border-color:transparent}
  .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;transition:width .4s ease}
  .over{color:var(--red)!important;font-weight:700}

  /* ==== قائمة العمليات ==== */
  .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:12px;transition:.15s}
  .item:hover{background:var(--card2)}
  .ico{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .info{flex:1;min-width:0}
  .info .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .amt{font-size:14px;font-weight:700;direction:ltr;white-space:nowrap}
  .amt.in{color:var(--green)}
  .amt.out{color:var(--red)}
  .del{background:transparent;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:5px 7px;border-radius:7px;transition:.15s;line-height:1}
  .del:hover{background:#ef444422;color:var(--red)}

  .empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}
  .empty .e{font-size:30px;display:block;margin-bottom:8px;opacity:.5}

  /* ==== توست ==== */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--green);color:#04140a;padding:11px 22px;border-radius:11px;
    font-size:13.5px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted)}
  .foot button{background:none;border:0;color:var(--red);font-family:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline;opacity:.75}
  .foot button:hover{opacity:1}

  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat .value{font-size:17px}
  }
  @media(max-width:420px){
    .stats{grid-template-columns:1fr 1fr;gap:9px}
    .stat{padding:12px}
    .card{padding:14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">💰</div>
      <div>
        <h1>ميزان</h1>
        <div class="sub">إدارة أموالك بذكاء</div>
      </div>
    </div>
    <input type="month" id="monthPicker">
  </header>

  <!-- الإحصاءات -->
  <section class="stats">
    <div class="stat" style="--c:var(--accent)">
      <div class="label">الرصيد الحالي</div>
      <div class="value" id="sBalance">0 <small>ج.م</small></div>
    </div>
    <div class="stat" style="--c:var(--green)">
      <div class="label">إجمالي الدخل</div>
      <div class="value" id="sIncome">0 <small>ج.م</small></div>
    </div>
    <div class="stat" style="--c:var(--red)">
      <div class="label">إجمالي المصروفات</div>
      <div class="value" id="sExpense">0 <small>ج.م</small></div>
    </div>
    <div class="stat" style="--c:var(--gold)">
      <div class="label">نسبة التوفير</div>
      <div class="value" id="sSave">0<small>%</small></div>
    </div>
  </section>

  <!-- فورم + شارت -->
  <section class="grid">
    <div class="card">
      <h2>➕ إضافة عملية</h2>
      <div class="tabs">
        <button class="tab active" data-type="expense" id="tabExpense">مصروف</button>
        <button class="tab" data-type="income" id="tabIncome">دخل</button>
      </div>
      <form id="txForm">
        <div class="field">
          <label>المبلغ (ج.م)</label>
          <input type="number" id="fAmount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label>الفئة</label>
          <select id="fCategory"></select>
        </div>
        <div class="field">
          <label>البيان (اختياري)</label>
          <input type="text" id="fNote" placeholder="مثال: غداء مع الأصدقاء">
        </div>
        <div class="field">
          <label>التاريخ</label>
          <input type="date" id="fDate" required>
        </div>
        <button type="submit" class="btn-primary">إضافة</button>
      </form>
    </div>

    <div class="card">
      <h2>📊 توزيع المصروفات</h2>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </section>

  <!-- الميزانيات -->
  <section class="card" style="margin-bottom:16px">
    <h2>🎯 ميزانية الفئات</h2>
    <div id="budgets"></div>
  </section>

  <!-- العمليات -->
  <section class="card">
    <div class="list-head">
      <h2 style="margin:0">🧾 العمليات</h2>
      <span class="sub" id="count">0 عملية</span>
    </div>
    <div id="list"></div>
  </section>

  <div class="foot">
    بياناتك محفوظة على جهازك فقط ·
    <button id="clearAll">حذف كل البيانات</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= الثوابت ================= */
const KEY = 'mizan_v1';

const CATS = {
  expense: [
    {n:'طعام وشراب', i:'🍔'}, {n:'مواصلات', i:'🚗'}, {n:'فواتير', i:'🧾'},
    {n:'سكن وإيجار', i:'🏠'}, {n:'صحة', i:'💊'}, {n:'تعليم', i:'📚'},
    {n:'ترفيه', i:'🎮'}, {n:'ملابس', i:'👕'}, {n:'تسوق', i:'🛍️'}, {n:'أخرى', i:'📦'}
  ],
  income: [
    {n:'راتب', i:'💼'}, {n:'عمل حر', i:'💻'}, {n:'استثمار', i:'📈'},
    {n:'هدية', i:'🎁'}, {n:'أخرى', i:'➕'}
  ]
};

const PALETTE = ['#6366f1','#22c55e','#f59e0b','#ef4444','#06b6d4','#a855f7','#ec4899','#84cc16','#f97316','#14b8a6'];

/* ================= الحالة ================= */
let state = { tx: [], budgets: {} };
let currentType = 'expense';
let currentMonth = ymOf(new Date());

function ymOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      state.tx = Array.isArray(p.tx) ? p.tx : [];
      state.budgets = (p.budgets && typeof p.budgets === 'object') ? p.budgets : {};
    }
  }catch(e){ console.warn('فشل تحميل البيانات', e); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ console.warn('فشل الحفظ', e); }
}

/* ================= أدوات ================= */
const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
function money(n){ return nf.format(Math.round(n*100)/100); }

function iconOf(cat){
  for(const k in CATS){
    const f = CATS[k].find(c => c.n === cat);
    if(f) return f.i;
  }
  return '📦';
}
function fmtDate(s){
  try{
    return new Date(s + 'T00:00:00').toLocaleDateString('ar-EG-u-nu-latn', {day:'numeric', month:'short'});
  }catch(e){ return s; }
}
function txOfMonth(){
  return state.tx.filter(t => String(t.date).slice(0,7) === currentMonth);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* ================= الرسم ================= */
function renderStats(){
  const txs = txOfMonth();
  const income  = txs.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  const balance = income - expense;
  const rate = income > 0 ? Math.round((income - expense) / income * 100) : 0;

  const bEl = document.getElementById('sBalance');
  bEl.innerHTML = `${money(balance)} <small>ج.م</small>`;
  bEl.style.color = balance < 0 ? 'var(--red)' : 'var(--txt)';

  document.getElementById('sIncome').innerHTML  = `${money(income)} <small>ج.م</small>`;
  document.getElementById('sExpense').innerHTML = `${money(expense)} <small>ج.م</small>`;

  const sEl = document.getElementById('sSave');
  sEl.innerHTML = `${rate}<small>%</small>`;
  sEl.style.color = rate < 0 ? 'var(--red)' : (rate >= 20 ? 'var(--green)' : 'var(--gold)');
}

function renderChart(){
  const canvas = document.getElementById('chart');
  const totals = {};
  txOfMonth().filter(t => t.type === 'expense')
    .forEach(t => totals[t.category] = (totals[t.category] || 0) + t.amount);

  const entries = Object.entries(totals).sort((a,b) => b[1] - a[1]);
  const total = entries.reduce((s,e) => s + e[1], 0);

  /* --- الرسم على الكانفاس --- */
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth || 190;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const cx = size/2, cy = size/2, R = size/2 - 6, thick = size * 0.16;

  if(total === 0){
    ctx.beginPath();
    ctx.arc(cx, cy, R - thick/2, 0, Math.PI*2);
    ctx.strokeStyle = '#2a3448';
    ctx.lineWidth = thick;
    ctx.stroke();

    ctx.fillStyle = '#8b97ad';
    ctx.font = '600 12px Segoe UI, Tahoma';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('لا توجد بيانات', cx, cy);
  } else {
    let start = -Math.PI/2;
    entries.forEach(([name, val], i) => {
      const angle = (val / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx, cy, R - thick/2, start, start + angle);
      ctx.strokeStyle = PALETTE[i % PALETTE.length];
      ctx.lineWidth = thick;
      ctx.lineCap = 'butt';
      ctx.stroke();
      start += angle;
    });

    ctx.fillStyle = '#e8edf7';
    ctx.font = '700 15px Segoe UI, Tahoma';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(money(total), cx, cy - 7);

    ctx.fillStyle = '#8b97ad';
    ctx.font = '500 10.5px Segoe UI, Tahoma';
    ctx.fillText('إجمالي المصروف', cx, cy + 11);
  }

  /* --- الليجند --- */
  const lg = document.getElementById('legend');
  if(!entries.length){
    lg.innerHTML = '<div class="empty" style="padding:8px">أضف مصروفاتك لتظهر النسب</div>';
    return;
  }
  lg.innerHTML = entries.map(([name, val], i) => `
    <div class="lg">
      <span class="dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
      <span class="nm">${iconOf(name)} ${name}</span>
      <span class="vl">${money(val)} · ${Math.round(val/total*100)}%</span>
    </div>`).join('');
}

function renderBudgets(){
  const spent = {};
  txOfMonth().filter(t => t.type === 'expense')
    .forEach(t => spent[t.category] = (spent[t.category] || 0) + t.amount);

  const rows = CATS.expense
    .map(c => c.n)
    .filter(c => (state.budgets[c] || 0) > 0 || spent[c] > 0);

  const box = document.getElementById('budgets');

  if(!rows.length){
    box.innerHTML = '<div class="empty"><span class="e">🎯</span>حدّد ميزانية لأي فئة عشان تتابع صرفك فيها</div>';
    return;
  }

  box.innerHTML = rows.map(cat => {
    const budget = state.budgets[cat] || 0;
    const used = spent[cat] || 0;
    const pct = budget > 0 ? Math.min(used / budget * 100, 100) : 0;
    const over = budget > 0 && used > budget;
    const color = over ? 'var(--red)' : (pct >= 75 ? 'var(--gold)' : 'var(--green)');

    return `
      <div class="brow">
        <div class="btop">
          <span class="bname">${iconOf(cat)} ${cat}</span>
          <span class="bnum ${over ? 'over' : ''}">
            صُرف ${money(used)} من
            <input class="binput" type="number" min="0" step="1"
                   data-cat="${cat}" value="${budget || ''}" placeholder="0">
            ج.م
          </span>
        </div>
        <div class="bar">
          <div class="fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }).join('');
}

function renderList(){
  const txs = txOfMonth().slice().sort((a,b) => {
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.id > a.id) ? 1 : -1;
  });

  document.getElementById('count').textContent = `${txs.length} عملية`;
  const box = document.getElementById('list');

  if(!txs.length){
    box.innerHTML = '<div class="empty"><span class="e">🧾</span>لا توجد عمليات لهذا الشهر</div>';
    return;
  }

  box.innerHTML = txs.map(t => {
    const isIn = t.type === 'income';
    const title = t.note ? t.note : t.category;
    return `
      <div class="item">
        <div class="ico">${iconOf(t.category)}</div>
        <div class="info">
          <div class="t1">${escapeHtml(title)}</div>
          <div class="t2">${t.category} · ${fmtDate(t.date)}</div>
        </div>
        <div class="amt ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'}${money(t.amount)}</div>
        <button class="del" data-id="${t.id}" title="حذف">✕</button>
      </div>`;
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderAll(){
  renderStats();
  renderChart();
  renderBudgets();
  renderList();
}

/* ================= الفئات في القائمة ================= */
function fillCategories(){
  const sel = document.getElementById('fCategory');
  sel.innerHTML = CATS[currentType].map(c => `<option value="${c.n}">${c.i} ${c.n}</option>`).join('');
}

/* ================= الأحداث ================= */
function initEvents(){
  /* التابات */
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentType = tab.dataset.type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      fillCategories();
    });
  });

  /* إضافة عملية */
  document.getElementById('txForm').addEventListener('submit', e => {
    e.preventDefault();
    const amountEl = document.getElementById('fAmount');
    const amount = parseFloat(amountEl.value);

    if(!amount || amount <= 0){
      amountEl.focus();
      return;
    }

    const tx = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      type: currentType,
      amount: Math.round(amount * 100) / 100,
      category: document.getElementById('fCategory').value,
      note: document.getElementById('fNote').value.trim(),
      date: document.getElementById('fDate').value || todayStr()
    };

    state.tx.push(tx);
    save();

    /* لو التاريخ في شهر تاني، ننتقل له */
    const m = tx.date.slice(0, 7);
    if(m !== currentMonth){
      currentMonth = m;
      document.getElementById('monthPicker').value = m;
    }

    amountEl.value = '';
    document.getElementById('fNote').value = '';
    renderAll();
    amountEl.focus();
    toast('تمت الإضافة ✓');
  });

  /* تغيير الشهر */
  document.getElementById('monthPicker').addEventListener('change', e => {
    if(e.target.value){
      currentMonth = e.target.value;
      renderAll();
    }
  });

  /* حذف عملية */
  document.getElementById('list').addEventListener('click', e => {
    const btn = e.target.closest('.del');
    if(!btn) return;
    const id = btn.dataset.id;
    state.tx = state.tx.filter(t => t.id !== id);
    save();
    renderAll();
    toast('تم الحذف');
  });

  /* تعديل الميزانيات */
  document.getElementById('budgets').addEventListener('change', e => {
    const input = e.target.closest('.binput');
    if(!input) return;
    const cat = input.dataset.cat;
    const val = parseFloat(input.value);
    if(!val || val <= 0) delete state.budgets[cat];
    else state.budgets[cat] = val;
    save();
    renderBudgets();
    toast('تم تحديث الميزانية ✓');
  });

  /* حذف الكل */
  document.getElementById('clearAll').addEventListener('click', () => {
    if(confirm('متأكد إنك عايز تحذف كل البيانات؟ مش هينفع ترجعها.')){
      state = { tx: [], budgets: {} };
      save();
      renderAll();
      toast('تم حذف كل البيانات');
    }
  });

  /* إعادة رسم الشارت عند تغيير حجم الشاشة */
  let rz;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(renderChart, 150);
  });
}

/* ================= التشغيل ================= */
function init(){
  load();

  const mp = document.getElementById('monthPicker');
  mp.value = currentMonth;
  document.getElementById('fDate').value = todayStr();

  fillCategories();
  initEvents();
  renderAll();
}

init();
</script>
